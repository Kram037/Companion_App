name: Deploy GitHub Pages

on:
  push:
    branches: [main, tech_migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_DM_EMAIL: ${{ secrets.E2E_DM_EMAIL }}
          E2E_DM_PASSWORD: ${{ secrets.E2E_DM_PASSWORD }}
          E2E_PLAYER_EMAIL: ${{ secrets.E2E_PLAYER_EMAIL }}
          E2E_PLAYER_PASSWORD: ${{ secrets.E2E_PLAYER_PASSWORD }}
          E2E_CAMPAIGN_ID: ${{ secrets.E2E_CAMPAIGN_ID }}
          E2E_SESSION_ID: ${{ secrets.E2E_SESSION_ID }}
          E2E_CHARACTER_ID: ${{ secrets.E2E_CHARACTER_ID }}
          E2E_EMPTY_CAMPAIGN_ID: ${{ secrets.E2E_EMPTY_CAMPAIGN_ID }}
          E2E_MUTATION_TESTS: ${{ secrets.E2E_MUTATION_TESTS }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/companion-app
      # The repository still has the legacy branch deployment enabled. Let it
      # finish first so this Vite artifact remains the active Pages release.
      - run: sleep 30
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
